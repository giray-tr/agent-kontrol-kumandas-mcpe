<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Matematik & Kontrol Paneli</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f4f9; padding: 15px; color: #111; }
  .status { padding: 10px; border: 3px solid #000; border-radius: 8px; font-weight: bold; margin-bottom: 15px; text-align: center; background: #fff; }
  .box { border: 3.5px solid #000; border-radius: 10px; margin-bottom: 12px; background: #fff; overflow: hidden; }
  .box-header { padding: 14px; font-weight: 800; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #eaeaea; }
  .box-content { display: none; padding: 12px; border-top: 3px solid #000; }
  .box.open .box-content { display: block; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { padding: 12px; font-size: 14px; font-weight: bold; border: 2.5px solid #000; border-radius: 8px; background: #fff; cursor: pointer; }
  button:active { background: #000; color: #fff; }
  .math-btn { background: #1e293b; color: #38bdf8; }
  input { width: 100%; padding: 10px; margin-bottom: 8px; border: 2.5px solid #000; border-radius: 6px; box-sizing: border-box; font-weight: bold; }
  .formula { font-size: 12px; background: #f1f5f9; padding: 6px; border-radius: 6px; margin-bottom: 8px; font-family: monospace; }
</style>
</head>
<body>
  <div id="status" class="status">Bağlantı Kontrol Ediliyor...</div>

  <div class="box open">
    <div class="box-header" onclick="this.parentElement.classList.toggle('open')">
      <span>📐 Matematiksel 3D Yapılar (π & Trigonometri)</span><span>▼</span>
    </div>
    <div class="box-content">
      <div class="formula">x = r · cos(θ), z = r · sin(θ) | θ ∈ [0, 2π]</div>
      <label>Yarıçap (r):</label>
      <input type="number" id="radius" value="7" min="3" max="20">
      <div class="grid">
        <button class="math-btn" onclick="sendMath('circle', 'sea_lantern')">⭕ π Çemberi Ör</button>
        <button class="math-btn" onclick="sendMath('dome', 'glass')">🌐 3D Cam Kubbe</button>
        <button class="math-btn" onclick="sendMath('spiral', 'glowstone')">🧬 3D DNA Sarmalı</button>
        <button class="math-btn" onclick="sendMath('sinwave', 'diamond_block')">〰️ Sinüs Dalgası</button>
      </div>
    </div>
  </div>

  <div class="box">
    <div class="box-header" onclick="this.parentElement.classList.toggle('open')">
      <span>🕹️ Hareket Et</span><span>▼</span>
    </div>
    <div class="box-content">
      <div class="grid">
        <button onclick="sendCmd('agent move forward')">⬆️ İleri</button>
        <button onclick="sendCmd('agent move back')">⬇️ Geri</button>
        <button onclick="sendCmd('agent move left')">⬅️ Sola</button>
        <button onclick="sendCmd('agent move right')">➡️ Sağa</button>
        <button onclick="sendCmd('agent move up')">🔼 Yukarı</button>
        <button onclick="sendCmd('agent move down')">🔽 Aşağı</button>
        <button onclick="sendCmd('agent turn left')">↪️ Sola Dön</button>
        <button onclick="sendCmd('agent turn right')">↩️ Sağa Dön</button>
      </div>
    </div>
  </div>

  <div class="box">
    <div class="box-header" onclick="this.parentElement.classList.toggle('open')">
      <span>⛏️ Blok İşlemleri & Işınla</span><span>▼</span>
    </div>
    <div class="box-content">
      <div class="grid">
        <button onclick="sendCmd('agent destroy forward')">💥 Önü Kır</button>
        <button onclick="sendCmd('agent place 1 forward')">🧱 Taş Koy</button>
        <button onclick="sendCmd('agent tp @p')">✨ Yanıma Çağır</button>
      </div>
    </div>
  </div>

  <div class="box">
    <div class="box-header" onclick="this.parentElement.classList.toggle('open')">
      <span>💻 Özel Komut</span><span>▼</span>
    </div>
    <div class="box-content">
      <input type="text" id="customCmd" placeholder="Örn: time set day">
      <button style="width:100%" onclick="sendCmd(document.getElementById('customCmd').value)">Gönder</button>
    </div>
  </div>

<script>
  const ws = new WebSocket('ws://' + location.host);
  const st = document.getElementById('status');
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.type === 'status') {
      st.textContent = d.connected ? '🟢 Minecraft Bağlı (Hazır!)' : '🔴 Minecraft Bekleniyor (/connect 127.0.0.1:3000)';
    }
  };
  function sendCmd(cmd) { ws.send(JSON.stringify({ command: cmd })); }
  function sendMath(shape, block) {
    const r = document.getElementById('radius').value;
    ws.send(JSON.stringify({ mathShape: shape, radius: r, block: block }));
  }
</script>
</body>
</html>
