<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Canlı Kontrol Paneli</title>
<style>
  * {
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  body {
    background-color: #f0f2f5;
    color: #111;
    margin: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .header-card {
    background: #ffffff;
    border: 3px solid #000000;
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    box-shadow: 4px 4px 0px #000000;
  }
  .header-card h1 {
    margin: 0 0 8px 0;
    font-size: 22px;
  }
  .status-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    border: 2px solid #000000;
    background-color: #ffeaa7;
  }
  .status-connected {
    background-color: #55efc4;
  }
  .status-disconnected {
    background-color: #ff7675;
    color: #fff;
  }
  .quick-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .quick-btn {
    background: #74b9ff;
    color: #000;
    border: 3px solid #000000;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 3px 3px 0px #000000;
    transition: transform 0.1s;
  }
  .quick-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0px #000000;
  }
  .quick-btn.tp {
    background: #a29bfe;
  }

  /* Siyah Çerçeveli Açılır Kapanır Kutucuk (Accordion) */
  .accordion-box {
    background: #ffffff;
    border: 3.5px solid #000000;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 4px 4px 0px #000000;
    transition: all 0.2s ease;
  }
  .accordion-header {
    width: 100%;
    background: #ffffff;
    border: none;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 17px;
    font-weight: 800;
    color: #000000;
    cursor: pointer;
    text-align: left;
  }
  .accordion-header:hover {
    background-color: #f8f9fa;
  }
  .accordion-arrow {
    font-size: 18px;
    transition: transform 0.25s ease;
    display: inline-block;
  }
  .accordion-box.open .accordion-arrow {
    transform: rotate(180deg);
  }
  .accordion-box.open .accordion-header {
    border-bottom: 3px solid #000000;
    background-color: #ffeaa7;
  }
  .accordion-content {
    display: none;
    padding: 14px;
    background: #ffffff;
    animation: slideDown 0.2s ease-out;
  }
  .accordion-box.open .accordion-content {
    display: block;
  }
  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateY(-6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .dir-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .dir-btn {
    background: #dfe6e9;
    border: 2.5px solid #000000;
    border-radius: 10px;
    padding: 12px 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 2px 2px 0px #000000;
    text-align: center;
  }
  .dir-btn:active {
    transform: translate(2px, 2px);
    box-shadow: none;
  }
  .dir-btn.forward { background: #55efc4; }
  .dir-btn.destroy { background: #fab1a0; }
  .dir-btn.place { background: #81ecec; }
  .dir-btn.turn { background: #ffeaa7; }

  .slot-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 8px 12px;
    border: 2px solid #000000;
    border-radius: 10px;
    background: #f8f9fa;
    font-weight: bold;
    font-size: 14px;
  }
  .slot-row input {
    width: 60px;
    padding: 6px;
    border: 2px solid #000000;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
  }

  .custom-cmd-row {
    display: flex;
    gap: 8px;
  }
  .custom-cmd-row input {
    flex: 1;
    padding: 10px;
    border: 2.5px solid #000000;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
  }
  .custom-cmd-row button {
    padding: 10px 16px;
    background: #55efc4;
    border: 2.5px solid #000000;
    border-radius: 10px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 2px 2px 0px #000000;
  }

  .log-box {
    background: #1e272e;
    color: #0be881;
    border: 3px solid #000000;
    border-radius: 12px;
    padding: 12px;
    font-family: monospace;
    font-size: 13px;
    min-height: 44px;
    box-shadow: 4px 4px 0px #000000;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header-card">
    <h1>🤖 Agent Kontrol Paneli</h1>
    <div id="statusBadge" class="status-badge">Sunucuya Bağlanıyor...</div>
  </div>

  <div class="quick-bar">
    <button class="quick-btn" onclick="sendCmd('agent create')">✨ Agent Çağır</button>
    <button class="quick-btn tp" onclick="sendCmd('agent tp @p')">⚡ Yanıma Işınla</button>
  </div>

  <!-- 1. HAREKET ET AÇILIR KUTUSU -->
  <div class="accordion-box open" id="box-move">
    <button class="accordion-header" onclick="toggleBox('box-move')">
      <span>🏃 Hareket Et (İleri, Sağa, Sola, Yukarı, Aşağı)</span>
      <span class="accordion-arrow">▼</span>
    </button>
    <div class="accordion-content">
      <div class="dir-grid">
        <button class="dir-btn" onclick="sendCmd('agent move up')">⬆️ Yukarı</button>
        <button class="dir-btn forward" onclick="sendCmd('agent move forward')">🔼 İleri</button>
        <button class="dir-btn" onclick="sendCmd('agent move down')">⬇️ Aşağı</button>
        <button class="dir-btn" onclick="sendCmd('agent move left')">⬅️ Sola</button>
        <button class="dir-btn" onclick="sendCmd('agent move back')">🔽 Geri</button>
        <button class="dir-btn" onclick="sendCmd('agent move right')">➡️ Sağa</button>
      </div>
    </div>
  </div>

  <!-- 2. BLOĞU KIR AÇILIR KUTUSU -->
  <div class="accordion-box" id="box-destroy">
    <button class="accordion-header" onclick="toggleBox('box-destroy')">
      <span>⛏️ Bloğu Kır (Önündeki, Yukarı, Aşağı...)</span>
      <span class="accordion-arrow">▼</span>
    </button>
    <div class="accordion-content">
      <div class="dir-grid">
        <button class="dir-btn destroy" onclick="sendCmd('agent destroy up')">⬆️ Yukarıyı Kır</button>
        <button class="dir-btn destroy" onclick="sendCmd('agent destroy forward')">🔼 Önündekini Kır</button>
        <button class="dir-btn destroy" onclick="sendCmd('agent destroy down')">⬇️ Aşağıyı Kır</button>
        <button class="dir-btn destroy" onclick="sendCmd('agent destroy left')">⬅️ Solu Kır</button>
        <button class="dir-btn destroy" onclick="sendCmd('agent destroy back')">🔽 Arkayı Kır</button>
        <button class="dir-btn destroy" onclick="sendCmd('agent destroy right')">➡️ Sağı Kır</button>
      </div>
    </div>
  </div>

  <!-- 3. BLOK KOY AÇILIR KUTUSU -->
  <div class="accordion-box" id="box-place">
    <button class="accordion-header" onclick="toggleBox('box-place')">
      <span>🧱 Blok Koy (Yön Seçerek Yerleştir)</span>
      <span class="accordion-arrow">▼</span>
    </button>
    <div class="accordion-content">
      <div class="slot-row">
        <span>Agent Envanter Slotu (1 - 27):</span>
        <input type="number" id="slotNum" value="1" min="1" max="27">
      </div>
      <div class="dir-grid">
        <button class="dir-btn place" onclick="placeBlock('up')">⬆️ Yukarı Koy</button>
        <button class="dir-btn place" onclick="placeBlock('forward')">🔼 Önüne Koy</button>
        <button class="dir-btn place" onclick="placeBlock('down')">⬇️ Aşağı Koy</button>
        <button class="dir-btn place" onclick="placeBlock('left')">⬅️ Sola Koy</button>
        <button class="dir-btn place" onclick="placeBlock('back')">🔽 Arkaya Koy</button>
        <button class="dir-btn place" onclick="placeBlock('right')">➡️ Sağa Koy</button>
      </div>
    </div>
  </div>

  <!-- 4. DÖN VE EŞYA TOPLA AÇILIR KUTUSU -->
  <div class="accordion-box" id="box-turn">
    <button class="accordion-header" onclick="toggleBox('box-turn')">
      <span>🔄 Dön & Eşya Topla / Bırak</span>
      <span class="accordion-arrow">▼</span>
    </button>
    <div class="accordion-content">
      <div class="dir-grid">
        <button class="dir-btn turn" onclick="sendCmd('agent turn left')">↩️ Sola Dön</button>
        <button class="dir-btn turn" onclick="sendCmd('agent collect all')">🧲 Eşyaları Topla</button>
        <button class="dir-btn turn" onclick="sendCmd('agent turn right')">↪️ Sağa Dön</button>
        <button class="dir-btn" onclick="sendCmd('agent dropall forward')">📦 Önüne Bırak</button>
        <button class="dir-btn" onclick="sendCmd('agent till forward')">🌾 Toprağı Çapala</button>
        <button class="dir-btn" onclick="sendCmd('agent attack forward')">⚔️ Önüne Vur</button>
      </div>
    </div>
  </div>

  <!-- 5. ÖZEL KOMUT AÇILIR KUTUSU -->
  <div class="accordion-box" id="box-custom">
    <button class="accordion-header" onclick="toggleBox('box-custom')">
      <span>⌨️ Özel Komut Gönder</span>
      <span class="accordion-arrow">▼</span>
    </button>
    <div class="accordion-content">
      <div class="custom-cmd-row">
        <input type="text" id="customInput" placeholder="Örn: setblock ~ ~1 ~ diamond_block">
        <button onclick="sendCustom()">Gönder</button>
      </div>
    </div>
  </div>

  <div class="log-box" id="logBox">> Hazır. Bir kutuya dokunup komut seçin.</div>
</div>

<script>
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${protocol}//${window.location.host}`);
  const statusBadge = document.getElementById('statusBadge');
  const logBox = document.getElementById('logBox');

  ws.onopen = () => {
    statusBadge.textContent = '🟢 Web Paneli Bağlı (Minecraft Bekleniyor)';
    statusBadge.className = 'status-badge status-connected';
  };

  ws.onclose = () => {
    statusBadge.textContent = '🔴 Sunucu Bağlantısı Kesildi';
    statusBadge.className = 'status-badge status-disconnected';
  };

  ws.onmessage = (event) => {
    logBox.textContent = '> ' + event.data;
  };

  function toggleBox(boxId) {
    const box = document.getElementById(boxId);
    box.classList.toggle('open');
  }

  function sendCmd(command) {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'command', command: command }));
      logBox.textContent = '> Gönderildi: /' + command;
    } else {
      logBox.textContent = '> Hata: Sunucuya bağlı değil!';
    }
  }

  function placeBlock(direction) {
    const slot = document.getElementById('slotNum').value || 1;
    sendCmd(`agent place ${slot} ${direction}`);
  }

  function sendCustom() {
    const input = document.getElementById('customInput');
    const cmd = input.value.trim().replace(/^\//, '');
    if (cmd) {
      sendCmd(cmd);
      input.value = '';
    }
  }
</script>

</body>
</html>
